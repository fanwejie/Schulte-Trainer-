<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F3F3F3" />
  <title>Schulte Trainer · 舒尔特方格训练</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='14' fill='%230067C0'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='4'%3E%3Crect x='10' y='10' width='19' height='19' rx='4'/%3E%3Crect x='34' y='10' width='19' height='19' rx='4'/%3E%3Crect x='10' y='34' width='19' height='19' rx='4'/%3E%3Crect x='34' y='34' width='19' height='19' rx='4'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- Win11 风格背景光斑 -->
  <div class="bg-decor" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <!-- ============ 登录页 ============ -->
  <section id="login-view" class="center-screen">
    <div class="login-card card fade-in">
      <div class="login-logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="46" height="46">
          <rect x="2" y="2" width="60" height="60" rx="14" fill="#0067C0"/>
          <g fill="none" stroke="#fff" stroke-width="4">
            <rect x="10" y="10" width="19" height="19" rx="4"/>
            <rect x="34" y="10" width="19" height="19" rx="4"/>
            <rect x="10" y="34" width="19" height="19" rx="4"/>
            <rect x="34" y="34" width="19" height="19" rx="4"/>
          </g>
        </svg>
      </div>
      <h1 class="login-title">Schulte Trainer</h1>
      <p class="login-sub" data-i18n="login.sub">注意力 · 视觉搜索 · 反应速度</p>

      <div id="login-lang" class="seg login-lang" role="group" aria-label="Language"></div>

      <form id="login-form" class="login-form" autocomplete="on">
        <label class="field-label" data-i18n="login.name" for="name-input">昵称</label>
        <input
          id="name-input"
          class="text-input"
          type="text"
          maxlength="20"
          autocomplete="nickname"
          placeholder="输入你的名字"
          required
        />
        <p id="login-hint" class="login-hint" data-i18n="login.hint">
          首次输入名字会自动注册；同一台设备下次访问将自动登录。
        </p>
        <button id="login-btn" type="submit" class="btn primary block" data-i18n="login.enter">
          进入训练
        </button>
      </form>

      <div id="login-users" class="login-users">
        <p class="lu-head"><span data-i18n="users.title">已注册用户</span></p>
        <div id="login-user-list" class="lu-list"></div>
      </div>
    </div>
  </section>

  <!-- ============ 主界面 ============ -->
  <div id="main-view" class="hidden">
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 64 64" width="26" height="26" aria-hidden="true">
          <rect x="2" y="2" width="60" height="60" rx="14" fill="#0067C0"/>
          <g fill="none" stroke="#fff" stroke-width="4">
            <rect x="10" y="10" width="19" height="19" rx="4"/>
            <rect x="34" y="10" width="19" height="19" rx="4"/>
            <rect x="10" y="34" width="19" height="19" rx="4"/>
            <rect x="34" y="34" width="19" height="19" rx="4"/>
          </g>
        </svg>
        <div class="brand-text">
          <span class="brand-name">舒尔特方格</span>
          <span class="brand-sub">Schulte Trainer</span>
        </div>
      </div>

      <div class="topbar-right">
        <button id="sidebar-toggle" class="icon-btn" type="button" aria-label="展开或收起训练选项" aria-expanded="true" title="训练选项">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
            <path fill="currentColor" d="M11.5 5 7 10l4.5 5V5z" />
          </svg>
        </button>
        <button id="history-btn" class="icon-btn" type="button" aria-label="历史成绩" title="历史成绩">
          <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <circle cx="10" cy="10" r="7"/>
              <path d="M10 6.4V10l2.6 1.7"/>
            </g>
          </svg>
        </button>
        <button id="settings-btn" class="icon-btn" type="button" aria-label="设置" title="设置">
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </g>
          </svg>
        </button>
        <div class="user-menu" id="user-menu">
          <button id="user-chip" class="user-chip" type="button" aria-haspopup="true" aria-expanded="false">
            <span id="user-avatar" class="avatar"></span>
            <span id="user-chip-name" class="chip-name"></span>
            <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true">
              <path fill="currentColor" d="M5.5 7.5 10 12l4.5-4.5H5.5z"/>
            </svg>
          </button>
          <div class="menu" role="menu">
            <div class="menu-head">
              <span id="menu-avatar" class="avatar small"></span>
              <span id="menu-name"></span>
            </div>
            <button id="switch-btn" class="menu-item" type="button" role="menuitem" data-i18n="menu.switch">
              <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M7.5 12.5v2l-4-3 4-3v2c3 0 5.5 1 6.5 3-.8-1.7-2.5-3-6.5-3z" transform="rotate(180 10 10)"/></svg>
              切换用户
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="layout">
      <!-- 左侧训练选项栏（抽屉） -->
      <aside id="sidebar" class="sidebar" aria-label="训练选项">
        <div class="side-inner">
          <div class="side-top">
            <div class="side-brand-row">
              <svg viewBox="0 0 64 64" width="22" height="22" aria-hidden="true">
                <rect x="2" y="2" width="60" height="60" rx="14" fill="#0067C0"/>
                <g fill="none" stroke="#fff" stroke-width="4">
                  <rect x="10" y="10" width="19" height="19" rx="4"/>
                  <rect x="34" y="10" width="19" height="19" rx="4"/>
                  <rect x="10" y="34" width="19" height="19" rx="4"/>
                  <rect x="34" y="34" width="19" height="19" rx="4"/>
                </g>
              </svg>
              <span class="side-title" data-i18n="side.title">训练选项</span>
            </div>
          </div>
          <p id="hello" class="hello side-hello"></p>

          <div class="side-main">
            <div class="side-label" data-i18n="side.spec">方格规格</div>
            <div class="seg seg-v" id="size-seg" role="group" aria-label="方格规格"></div>

            <button id="start-btn" class="btn primary start-btn" type="button" data-i18n="side.start">开始训练</button>

            <p class="rule-note" data-i18n="side.rule">
              开始后请按 1 → 2 → 3 … 的顺序点击；从按下 1 起计时。
            </p>
          </div>
        </div>
      </aside>

      <!-- 右侧：状态 HUD + 方格 -->
      <div class="main-col">
        <section class="card hud-bar">
          <div class="hud-stat">
            <span class="stat-label" data-i18n="hud.time">用时</span>
            <span id="timer" class="stat-value mono">0.00 秒</span>
          </div>
          <div class="hud-stat">
            <span class="stat-label" data-i18n="hud.progress">进度</span>
            <span id="progress" class="stat-value">0 / 25</span>
          </div>
          <div class="hud-stat">
            <span class="stat-label" data-i18n="hud.last">上一轮</span>
            <span id="last-time" class="stat-value">—</span>
          </div>
          <button id="reset-link" class="link-btn" type="button" data-i18n="hud.giveUp">放弃本轮</button>
        </section>

        <section id="board-card" class="card board-card">
          <div id="board" class="board" role="grid" aria-label="舒尔特方格">
            <div id="wait-hint" class="wait-hint hidden" data-i18n="wait.hint">点击 1 开始计时</div>
          </div>
        </section>
        <button id="start-btn-mobile" class="btn primary start-btn-mobile mobile-only" type="button" data-i18n="side.start">开始训练</button>
      </div>
    </div>
  </div>

  <!-- ============ 历史成绩弹窗 ============ -->
  <div id="history-overlay" class="overlay hidden">
    <div class="dialog history-dialog card" role="dialog" aria-modal="true" aria-label="历史成绩">
      <div class="hd-head">
        <h2 class="hd-title" data-i18n="hist.title">历史成绩</h2>
        <button id="history-close" class="icon-btn" type="button" aria-label="关闭">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
            <path fill="currentColor" d="M5.5 5.5 10 10l4.5-4.5L16 7l-4.5 4.5L16 16l-1.5 1.5L10 13l-4.5 4.5L4 16l4.5-4.5L4 7l1.5-1.5z"/>
          </svg>
        </button>
      </div>
      <p id="history-summary" class="history-summary"></p>
      <div id="history-view" class="seg history-view" role="group" aria-label="查看方式"></div>
      <div id="history-modes" class="seg history-modes" role="group" aria-label="按规格筛选"></div>
      <div id="chart-panel" class="chart-panel hidden">
        <div id="chart-ranges" class="seg chart-ranges" role="group" aria-label="时间范围"></div>
        <p id="chart-meta" class="chart-meta"></p>
        <div id="chart-box" class="chart-box"></div>
        <div id="chart-legend" class="chart-legend"></div>
      </div>
      <div id="history-list" class="history-list"></div>
      <div class="hd-foot">
        <button id="history-clear" class="btn danger-ghost" type="button">清空我的记录</button>
      </div>
    </div>
  </div>

  <!-- ============ 设置弹窗 ============ -->
  <div id="settings-overlay" class="overlay hidden">
    <div class="dialog settings-dialog card" role="dialog" aria-modal="true" aria-label="设置">
      <div class="hd-head">
        <h2 class="hd-title" data-i18n="settings.title">设置</h2>
        <button id="settings-close" class="icon-btn" type="button" aria-label="关闭">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
            <path fill="currentColor" d="M5.5 5.5 10 10l4.5-4.5L16 7l-4.5 4.5L16 16l-1.5 1.5L10 13l-4.5 4.5L4 16l4.5-4.5L4 7l1.5-1.5z"/>
          </svg>
        </button>
      </div>

      <div class="set-group">
        <p class="set-label" data-i18n="settings.lang">语言 / Language</p>
        <div id="set-lang" class="seg set-theme" role="group" aria-label="Language"></div>
      </div>

      <div class="set-group">
        <p class="set-label" data-i18n="settings.theme">界面主题</p>
        <div id="set-theme" class="seg set-theme" role="group" aria-label="界面主题"></div>
      </div>

      <div class="set-group">
        <p class="set-label" data-i18n="settings.size">数字大小</p>
        <div class="set-slider-row">
          <input id="set-fontsize" type="range" min="70" max="150" step="5" value="100" />
          <span id="set-fontsize-val" class="set-value">100%</span>
        </div>
      </div>

      <div class="set-group">
        <p class="set-label" data-i18n="settings.font">数字字体</p>
        <div class="set-font-row">
          <select id="set-font" class="text-input set-select"></select>
          <span id="set-font-sample" class="set-sample">8</span>
        </div>
      </div>

      <p id="settings-status" class="set-status"></p>

      <div class="hd-foot set-foot">
        <button id="settings-reset" class="btn" type="button" data-i18n="settings.reset">恢复默认</button>
      </div>
    </div>
  </div>

  <!-- ============ 完成弹窗 ============ -->
  <div id="done-overlay" class="overlay hidden">
    <div class="dialog card fade-in" id="done-dialog">
      <div id="grade-letter" class="grade-badge">—</div>
      <p id="done-slogan" class="done-slogan">全部找完，真棒！</p>
      <p id="done-size" class="done-size">规格 5×5</p>
      <p id="done-time" class="done-time mono">12.34 秒</p>
      <div class="dialog-actions">
        <button id="again-btn" class="btn" type="button" data-i18n="done.again">再来一次</button>
        <button id="back-btn" class="btn primary" type="button" data-i18n="done.finish">完成</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
